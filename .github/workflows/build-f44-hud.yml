name: Verify experimental F44 HUD patch
on:
  push:
    branches: ["experiment/f44-small-hud"]
    paths: [".github/workflows/build-f44-hud.yml", "experiments/f44-hud/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: experiment
          persist-credentials: false
      - name: Checkout exact upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: robertnisipeanu/idrive-apps
          ref: 88e8554b1d81593d85f8095b4f0c38213223990d
          path: upstream
          persist-credentials: false
      - name: Apply patch and check HUD protections
        working-directory: upstream
        run: |
          set -eu
          git apply --check ../experiment/experiments/f44-hud/cluster-render-0.4.900002.patch
          git apply ../experiment/experiments/f44-hud/cluster-render-0.4.900002.patch
          cd native/cluster-render
          g++ -std=c++14 -O2 -Wall -Wextra -Werror test/holds_test.cpp src/holds.cpp -o /tmp/f44-holds-test
          /tmp/f44-holds-test
